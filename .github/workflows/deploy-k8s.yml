name: Deploy k8s

on:
  push:
    branches: [main]

env:
  IMAGE: ${{ secrets.DOCKER_USER }}/backend
  TAG: sha-${{ github.sha }}

jobs:
  checks:
    uses: ./.github/workflows/pr-check.yml

  build:
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Вход в Docker Hub
        run: echo "${{ secrets.DOCKER_PASS }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin

      - name: Build and Push образа
        run: |
          docker build -t $IMAGE:$TAG -t $IMAGE:latest .
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Deploy to k3s
        env:
          IMAGE: ${{ env.IMAGE }}:${{ env.TAG }}
        run: |
          envsubst '$IMAGE' < manifests/backend.yaml | kubectl apply -f -
          kubectl rollout status deployment/backend-api --timeout=120s

  notify:
    name: Notify JOB
    needs: [checks, deploy, build]
    if: always()
    permissions:
      actions: read
    uses: ./.github/workflows/notify.yml
    with:
      checks_result: ${{ needs.checks.result }}
      deploy_result: ${{ needs.deploy.result }}
    secrets: inherit